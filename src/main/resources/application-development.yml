logging:
  level:
    root: INFO
server:
  servlet:
    session:
      timeout: 10m
spring:
  freemarker:
    settings.url_escaping_charset: utf-8
    cache: false
  # https://www.baeldung.com/spring-boot-h2-database
  # https://www.h2database.com/html/features.html#connection_modes
  datasource:
    url: "jdbc:postgresql://localhost:5432/delivery"
    username: delivery
    password: delivery
    jpa:
      hibernate:
        ddl-auto: none
      properties:
        hibernate:
          id.new_generator_mappings: true