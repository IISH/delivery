services:
  delivery-postgres:
    image: postgres:16-alpine3.23
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
    command: postgres -c max_connections=300 -c log_min_messages=LOG
    ports:
      - "5432:5432"
    volumes:
      - ./restore:/docker-entrypoint-initdb.d:ro
